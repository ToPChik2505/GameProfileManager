name: Refactor validation

on:
  push:
    branches:
      - refactor/architecture-performance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit:
    name: Windows Release build and unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GameProfileManager.slnx
      - name: Compile Release x64
        run: dotnet build GameProfileManager.slnx -c Release --no-restore
      - name: Run non-destructive unit tests
        run: dotnet run --project tests/GameProfileManager.Tests/GameProfileManager.Tests.csproj -c Release --no-build

# Запись в RTSS/NVIDIA и UI smoke на реальном мониторе/контроллере намеренно
# не запускаются в CI: для этих тестов требуется отдельная аппаратная проверка.
